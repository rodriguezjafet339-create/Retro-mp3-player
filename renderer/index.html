<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retro mp3 player</title>
    <link id="theme" rel="stylesheet" href="classic.css" />
    <script src="script.js" defer></script>
    <style>
      #window-controls {
        position: fixed;
        top: 4px;
        right: 4px;
        display: flex;
        gap: 4px;
        opacity: 0;
      }

      @keyframes fadeOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      #window-controls:hover {
        animation: fadeOut 5s;
      }

      #case {
        -webkit-app-region: drag;
      }

      button,
      #glass {
        -webkit-app-region: no-drag;
      }

      #win-min,
      #win-close {
        user-select: none;
      }
    </style>
  </head>
  <body style="visibility: hidden">
    <div id="window-controls">
      <button id="win-min">−</button>
      <button id="win-close">×</button>
    </div>
    <audio></audio>
    <div id="case">
      <div class="displays">
        <div class="top-controls">
          <button id="backwards"></button>
          <button id="forwards"></button>
        </div>
        <div id="glass">
          <div id="screen">
            <div id="text_output">
              <p id="author_track">Ethel Cain - Knuckle Velvet</p>
            </div>
            <div class="player-progress">
              <span id="current">0:00</span>
              <div id="progress-track">
                <div id="progress-bar"></div>
              </div>
              <span id="total">0:00</span>
            </div>
          </div>
        </div>
      </div>
      <div class="pad">
        <button class="up" id="Volume_up">+</button>
        <button class="prev" id="Previous">◀◀</button>
        <button class="play" id="Play_pause"></button>
        <button class="next" id="Next">▶▶</button>
        <button class="down" id="Volume_down">−</button>
      </div>
    </div>
  </body>
</html>
